<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PixOrbital">
  <!-- flat color blocks, no gradients, sharp corners -->
  <rect x="2" y="2" width="36" height="36" fill="#FFFFFF"/>
  <rect x="2" y="2" width="36" height="13" fill="#FF0000"/>
  <rect x="21" y="15" width="17" height="23" fill="#0000FF"/>
  <rect x="16" y="10" width="7" height="7" fill="#FFFF00"/>

  <!-- bold black grid lines -->
  <line x1="2" y1="15" x2="38" y2="15" stroke="#111111" stroke-width="2.5"/>
  <line x1="21" y1="15" x2="21" y2="38" stroke="#111111" stroke-width="2.5"/>
  <rect x="2" y="2" width="36" height="36" fill="none" stroke="#111111" stroke-width="2.5"/>
</svg>
